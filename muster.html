<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Muster IDs – VB G-RAM-G SUREPALLI: View group names, work IDs and muster IDs.">
  <title>Muster IDs – VB G-RAM-G SUREPALLI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0a0a0c; font-family: 'Outfit', sans-serif; }

    .muster-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1rem 5rem;
    }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 1.8rem;
      width: fit-content;
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── Header ── */
    .muster-header {
      text-align: center;
      margin-bottom: 1.8rem;
      animation: fadeInDown 0.6s ease-out;
    }
    .muster-header .page-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
    .muster-header h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.25rem; }
    .muster-header h1 span {
      background: linear-gradient(135deg, #6c5ce7, #00d2d3);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .muster-header p { color: rgba(255,255,255,0.4); font-size: 0.88rem; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 0.7rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 160px; }
    .filter-group label {
      font-size: 0.7rem; font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .filter-group select, .filter-group input {
      padding: 0.6rem 0.9rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      font-family: 'Outfit', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .filter-group select { appearance: none; }
    .filter-group select option { background: #1a1a22; }
    .filter-group select:focus, .filter-group input:focus { border-color: #6c5ce7; }
    .clear-btn {
      padding: 0.6rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: rgba(255,255,255,0.45);
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      font-family: 'Outfit', sans-serif;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .clear-btn:hover { background: rgba(255,255,255,0.09); color: #fff; }

    /* ── Stats ── */
    .stats-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .stat-chip {
      display: flex; align-items: center; gap: 0.4rem;
      background: rgba(108,92,231,0.1);
      border: 1px solid rgba(108,92,231,0.2);
      border-radius: 20px; padding: 0.3rem 0.8rem;
      font-size: 0.78rem; color: rgba(255,255,255,0.6);
    }
    .stat-chip strong { color: #a29bfe; }

    /* ════════════════════════════════
       EXCEL SPREADSHEET TABLE
    ════════════════════════════════ */
    .sheet-wrap {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeInUp 0.5s ease-out 0.2s both;
    }
    .sheet-scroll { overflow-x: auto; }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    /* Column-letter header row (A, B, C) */
    .col-header-row th {
      background: #1c1c24;
      border-bottom: 2px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 0.45rem 0.6rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      user-select: none;
    }
    .col-header-row th:last-child { border-right: none; }
    .col-corner { width: 42px; min-width: 42px; }

    /* Row-number cells */
    .cell-rownum {
      background: #1c1c24;
      border-right: 2px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 0.5rem;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      font-family: 'JetBrains Mono', monospace;
      min-width: 42px;
      width: 42px;
      user-select: none;
    }

    /* Label row (row 1) */
    .row-label td {
      background: rgba(108,92,231,0.1);
      border-bottom: 2px solid rgba(108,92,231,0.3);
      border-right: 1px solid rgba(255,255,255,0.07);
      padding: 0.65rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }
    .row-label td:last-child { border-right: none; }

    /* Data cells */
    .cell-workid, .cell-group, .cell-muster {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
      padding: 0.7rem 1rem;
      vertical-align: middle;
    }
    .cell-workid:last-child, .cell-group:last-child, .cell-muster:last-child { border-right: none; }

    /* Work ID — teal accent, merged */
    .cell-workid {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      font-weight: 600;
      color: #00d2d3;
      text-align: center;
      background: rgba(0,210,211,0.04);
      border-right: 2px solid rgba(0,210,211,0.15) !important;
    }

    /* Date Range — purple accent, merged */
    .cell-daterange {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: #a29bfe;
      text-align: center;
      background: rgba(108,92,231,0.06);
      border-right: 2px solid rgba(108,92,231,0.2) !important;
      white-space: nowrap;
    }
    .copy-all-btn {
      background: rgba(108,92,231,0.15);
      border: 1px solid rgba(108,92,231,0.3);
      color: rgba(255,255,255,0.6);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
    }
    .copy-all-btn:hover {
      background: rgba(108,92,231,0.3);
      color: #fff;
    }

    /* Group Name — white, merged */
    .cell-group {
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      text-align: center;
      background: rgba(108,92,231,0.04);
      border-right: 2px solid rgba(108,92,231,0.12) !important;
    }

    /* Muster ID — monospace amber */
    .cell-muster {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: rgba(255,220,100,0.95);
      display: table-cell;
    }

    /* Merged cells get a subtle left accent line */
    .cell-workid[rowspan], .cell-group[rowspan] {
      border-left: 3px solid rgba(0,210,211,0.2);
    }
    .cell-group[rowspan] {
      border-left: 3px solid rgba(108,92,231,0.2);
    }

    /* Row hover */
    .sheet-table tbody tr:hover .cell-workid,
    .sheet-table tbody tr:hover .cell-group,
    .sheet-table tbody tr:hover .cell-muster,
    .sheet-table tbody tr:hover .cell-rownum {
      background-color: rgba(255,255,255,0.025);
    }

    /* Last row in a bucket — thicker separator */
    .bucket-last .cell-workid,
    .bucket-last .cell-group,
    .bucket-last .cell-muster,
    .bucket-last .cell-rownum {
      border-bottom: 2px solid rgba(255,255,255,0.1) !important;
    }

    /* Copy button */
    .copy-btn {
      background: none; border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer; font-size: 0.85rem;
      padding: 0.15rem 0.3rem; border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      vertical-align: middle; margin-left: 0.4rem;
    }
    .copy-btn:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); }

    /* Empty / no-results */
    .empty-state, .no-results {
      text-align: center; padding: 3rem 1rem;
      color: rgba(255,255,255,0.25);
    }
    .empty-state .es-icon { font-size: 2.8rem; display: block; margin-bottom: 0.6rem; }
    .empty-state p { font-size: 0.88rem; line-height: 1.6; }
    .empty-state a { color: #6c5ce7; text-decoration: none; }

    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #6c5ce7; color: #fff;
      padding: 0.65rem 1.4rem; border-radius: 30px;
      font-weight: 600; font-size: 0.85rem;
      z-index: 9999; white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      box-shadow: 0 6px 20px rgba(108,92,231,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    mark {
      background: rgba(108,92,231,0.35);
      color: #fff; border-radius: 2px; padding: 0 2px;
    }

    @media (max-width: 500px) {
      .muster-header h1 { font-size: 1.3rem; }
      .cell-workid, .cell-group, .cell-muster { padding: 0.6rem 0.7rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="background-orb"></div>
  <div class="background-orb orb-2"></div>

  <div class="muster-page">
    <a href="index.html" class="back-btn">← Back</a>

    <div class="muster-header">
      <span class="page-icon">🗂️</span>
      <h1>Muster <span>IDs</span></h1>
      <p>VB G-RAM-G SUREPALLI — Group wise muster register</p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-daterange">📅 Date Range</label>
        <select id="filter-daterange">
          <option value="">All Date Ranges</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-workid">Work ID</label>
        <select id="filter-workid">
          <option value="">All Work IDs</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-search">Search</label>
        <input type="text" id="filter-search" placeholder="Group name or muster ID…">
      </div>
      <button class="clear-btn" id="clear-filter-btn">✕ Clear</button>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-chip">Groups: <strong id="stat-groups">0</strong></div>
      <div class="stat-chip">Muster IDs: <strong id="stat-total">0</strong></div>
      <div class="stat-chip" id="stat-filtered-wrap" style="display:none;">Shown: <strong id="stat-filtered">0</strong></div>
    </div>

    <!-- Spreadsheet -->
    <div class="sheet-wrap">
      <div class="sheet-scroll">
        <table class="sheet-table" id="sheet-table">
          <!-- Column-letter header -->
          <thead>
            <tr class="col-header-row">
              <th class="col-corner"></th>
              <th>A</th>
              <th>B</th>
              <th>C</th>
              <th>D</th>
            </tr>
            <!-- Row 1: column labels -->
            <tr class="row-label">
              <td class="cell-rownum">1</td>
              <td>Date Range</td>
              <td>Work ID</td>
              <td>Group Name</td>
              <td>Muster ID</td>
            </tr>
          </thead>
          <tbody id="sheet-tbody"></tbody>
        </table>

        <div class="empty-state" id="empty-state" style="display:none;">
          <span class="es-icon">📭</span>
          <p>No muster entries yet.<br>
          An admin can add entries via the <a href="admin.html">Admin Panel</a>.</p>
        </div>
        <div class="no-results" id="no-results" style="display:none;">
          🔍 No entries match your filter.
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">📋 Copied!</div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js" onerror=""></script>

  <script>
    /* ── localStorage helpers ── */
    const getMusterEntries = () => { const r = localStorage.getItem('admin_musters');    return r ? JSON.parse(r) : []; };
    const getWorkIds       = () => { const r = localStorage.getItem('admin_workids');     return r ? JSON.parse(r) : []; };
    const getDateRanges    = () => { const r = localStorage.getItem('admin_dateranges');  return r ? JSON.parse(r) : []; };

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ── Escape HTML ── */
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ── Highlight search match ── */
    function highlight(text, q) {
      if (!q) return esc(text);
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return esc(text);
      return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
    }

    const filterDaterange = document.getElementById('filter-daterange');
    const filterWorkid    = document.getElementById('filter-workid');
    const filterSearch    = document.getElementById('filter-search');
    const tbody           = document.getElementById('sheet-tbody');
    const emptyState      = document.getElementById('empty-state');
    const noResults       = document.getElementById('no-results');

    function populateDateRangeDropdown(dateRanges, entries) {
      const all = new Set([...dateRanges, ...entries.map(e => e.dateRange).filter(Boolean)]);
      const sel = filterDaterange.value;
      filterDaterange.innerHTML = '<option value="">All Date Ranges</option>';
      all.forEach(r => {
        const o = document.createElement('option');
        o.value = r; o.textContent = r;
        filterDaterange.appendChild(o);
      });
      filterDaterange.value = sel;
    }

    function populateWorkIdDropdown(workIds, entries) {
      const all = new Set([...workIds, ...entries.map(e => e.workId)]);
      const sel = filterWorkid.value;
      filterWorkid.innerHTML = '<option value="">All Work IDs</option>';
      all.forEach(w => {
        const o = document.createElement('option');
        o.value = w; o.textContent = w;
        filterWorkid.appendChild(o);
      });
      filterWorkid.value = sel;
    }

    function render() {
      const all        = getMusterEntries();
      const workIds    = getWorkIds();
      const dateRanges = getDateRanges();
      const selDate    = filterDaterange.value;
      const selWork    = filterWorkid.value;
      const q          = filterSearch.value.trim();

      document.getElementById('stat-total').textContent  = all.length;
      const allGroups = new Set(all.map(e => e.group + '||' + e.workId));
      document.getElementById('stat-groups').textContent = allGroups.size;

      populateDateRangeDropdown(dateRanges, all);
      populateWorkIdDropdown(workIds, all);

      let filtered = all;
      if (selDate) filtered = filtered.filter(e => e.dateRange === selDate);
      if (selWork) filtered = filtered.filter(e => e.workId === selWork);
      if (q) {
        const ql = q.toLowerCase();
        filtered = filtered.filter(e =>
          (e.group   || '').toLowerCase().includes(ql) ||
          (e.musterId|| '').toLowerCase().includes(ql) ||
          (e.workId  || '').toLowerCase().includes(ql) ||
          (e.dateRange||'').toLowerCase().includes(ql)
        );
      }

      const isFiltering = selDate || selWork || q;
      document.getElementById('stat-filtered-wrap').style.display = isFiltering ? 'flex' : 'none';
      if (isFiltering) document.getElementById('stat-filtered').textContent = filtered.length;

      tbody.innerHTML = '';
      emptyState.style.display = 'none';
      noResults.style.display  = 'none';

      if (all.length === 0)      { emptyState.style.display = 'block'; return; }
      if (filtered.length === 0) { noResults.style.display  = 'block'; return; }

      /* ── Build flat row list, sorted by dateRange → workId → group ── */
      const rows = filtered.map(e => ({
        dr:    e.dateRange || '—',
        wid:   e.workId    || '—',
        grp:   e.group     || '—',
        mid:   e.musterId  || '—',
      }));

      // Sort so identical dr/wid/grp are consecutive
      rows.sort((a, b) =>
        a.dr.localeCompare(b.dr) ||
        a.wid.localeCompare(b.wid) ||
        a.grp.localeCompare(b.grp)
      );

      /* ── Pre-compute rowspans ── */
      const drSpan  = new Array(rows.length).fill(0);
      const wSpan   = new Array(rows.length).fill(0);
      const gSpan   = new Array(rows.length).fill(0);

      for (let i = 0; i < rows.length; i++) {
        // Date Range span
        if (i === 0 || rows[i].dr !== rows[i - 1].dr) {
          let span = 1;
          while (i + span < rows.length && rows[i + span].dr === rows[i].dr) span++;
          drSpan[i] = span;
        }
        // Work ID span (within same dateRange)
        if (i === 0 || rows[i].wid !== rows[i - 1].wid || rows[i].dr !== rows[i - 1].dr) {
          let span = 1;
          while (i + span < rows.length && rows[i + span].wid === rows[i].wid && rows[i + span].dr === rows[i].dr) span++;
          wSpan[i] = span;
        }
        // Group span (within same dateRange + workId)
        if (i === 0 || rows[i].grp !== rows[i - 1].grp || rows[i].wid !== rows[i - 1].wid || rows[i].dr !== rows[i - 1].dr) {
          let span = 1;
          while (i + span < rows.length && rows[i + span].grp === rows[i].grp && rows[i + span].wid === rows[i].wid && rows[i + span].dr === rows[i].dr) span++;
          gSpan[i] = span;
        }
      }

      /* ── Render rows ── */
      rows.forEach((row, i) => {
        const tr = document.createElement('tr');

        // Bucket-last separator: last row before a new dateRange
        const isLastInDr = (i === rows.length - 1) || rows[i + 1].dr !== row.dr;
        if (isLastInDr) tr.classList.add('bucket-last');

        // Row number
        const tdNum = document.createElement('td');
        tdNum.className = 'cell-rownum';
        tdNum.textContent = i + 2; // row 1 is header
        tr.appendChild(tdNum);

        // Column A: Date Range (merged) + copy-all button
        if (drSpan[i] > 0) {
          // Collect all row data in this date range span
          const allRows = [];
          for (let j = i; j < i + drSpan[i]; j++) {
            allRows.push(rows[j]);
          }
          const copyText = allRows.map(r => `${r.wid} | ${r.grp} | ${r.mid}`).join('\n');

          const td = document.createElement('td');
          td.className = 'cell-daterange';
          td.rowSpan = drSpan[i];
          td.innerHTML =
            `<div style="display:flex;flex-direction:column;align-items:center;gap:0.4rem;">` +
              `<span>${highlight(row.dr, q)}</span>` +
              `<button class="copy-all-btn" title="Copy all ${allRows.length} rows">📋 Copy All</button>` +
            `</div>`;
          td.querySelector('.copy-all-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(copyText)
              .then(() => showToast(`📋 Copied ${allRows.length} rows`));
          });
          tr.appendChild(td);
        }

        // Column B: Work ID (merged)
        if (wSpan[i] > 0) {
          const td = document.createElement('td');
          td.className = 'cell-workid';
          td.rowSpan = wSpan[i];
          td.innerHTML = highlight(row.wid, q);
          tr.appendChild(td);
        }

        // Column C: Group Name (merged)
        if (gSpan[i] > 0) {
          const td = document.createElement('td');
          td.className = 'cell-group';
          td.rowSpan = gSpan[i];
          td.innerHTML = highlight(row.grp, q);
          tr.appendChild(td);
        }

        // Column D: Muster ID (never merged)
        const tdM = document.createElement('td');
        tdM.className = 'cell-muster';
        tdM.innerHTML = `<span>${highlight(row.mid, q)}</span>` +
          `<button class="copy-btn" data-val="${esc(row.mid)}" title="Copy">📋</button>`;
        tdM.querySelector('.copy-btn').addEventListener('click', ev => {
          navigator.clipboard.writeText(ev.currentTarget.dataset.val)
            .then(() => showToast('📋 Copied: ' + ev.currentTarget.dataset.val));
        });
        tr.appendChild(tdM);

        tbody.appendChild(tr);
      });
    }

    /* ── Events ── */
    filterDaterange.addEventListener('change', render);
    filterWorkid.addEventListener('change', render);
    filterSearch.addEventListener('input',  render);
    document.getElementById('clear-filter-btn').addEventListener('click', () => {
      filterDaterange.value = ''; filterWorkid.value = ''; filterSearch.value = ''; render();
    });

    /* ── Firebase real-time listener ── */
    function initFirebaseListener() {
      const cfg = window.FIREBASE_CONFIG;
      if (!cfg || !cfg.apiKey || cfg.apiKey === 'YOUR_API_KEY') { render(); return; }
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        const db = firebase.firestore();
        db.collection('gramg').doc('musters').onSnapshot(doc => {
          if (doc.exists && doc.data().entries)
            localStorage.setItem('admin_musters', JSON.stringify(doc.data().entries));
          render();
        }, () => render());
        db.collection('gramg').doc('workids').onSnapshot(doc => {
          if (doc.exists && doc.data().list)
            localStorage.setItem('admin_workids', JSON.stringify(doc.data().list));
          render();
        }, () => {});
        db.collection('gramg').doc('dateranges').onSnapshot(doc => {
          if (doc.exists && doc.data().list)
            localStorage.setItem('admin_dateranges', JSON.stringify(doc.data().list));
          render();
        }, () => {});
      } catch(e) { render(); }
    }

    initFirebaseListener();
  </script>
</body>
</html>
